name = "edgeforge"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Durable Objects (modern exports syntax, SQLite storage)
[durable_objects]
bindings = [
  { name = "WORKSPACE", class_name = "WorkspaceDO" }
]

[[durable_objects.migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceDO"]

[exports.WorkspaceDO]
type = "durable-object"
storage = "sqlite"

# Workers AI
[ai]
binding = "AI"

# KV for the deploy approval queue, artifact fallback, and the AI budget ledger.
# Both bindings may share one namespace; budget keys are namespaced under `budget:`.
[[kv_namespaces]]
binding = "APPROVALS"
id = "605e09bc35b54d6e8d2ac9c3a22a51d3"

[[kv_namespaces]]
binding = "BUDGET"
id = "7d7ebe28874743588b71c1641ddfe73d"

# R2 for artifacts — enable in the dashboard, then uncomment to use R2
# [[r2_buckets]]
# binding = "ARTIFACTS"
# bucket_name = "edgeforge-artifacts"

# Static assets (frontend)
[assets]
directory = "frontend/dist"
binding = "ASSETS"

# ── Real (not simulated) deploys ──────────────────────────────────────────────
# Approvals are turned into LIVE workers via the Workers Upload API. The
# subdomain below is from this account (`wrangler login` → Workers API).
# CF_ACCOUNT_ID and CLOUDFLARE_API_TOKEN are set as secrets on the deployed
# Worker so they never reach the repo.
[vars]
CF_ACCOUNT_SUBDOMAIN = "creatorplntu"