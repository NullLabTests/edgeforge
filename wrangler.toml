name = "edgeforge"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Durable Objects (modern exports syntax, SQLite storage)
[durable_objects]
bindings = [
  { name = "WORKSPACE", class_name = "WorkspaceDO" }
]

[[durable_objects.migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceDO"]

[exports.WorkspaceDO]
type = "durable-object"
storage = "sqlite"

# Workers AI
[ai]
binding = "AI"

# KV for the deploy approval queue, artifact fallback, and the AI budget ledger.
# Both bindings may share one namespace; budget keys are namespaced under `budget:`.
[[kv_namespaces]]
binding = "APPROVALS"
id = "<your-kv-namespace-id>"

[[kv_namespaces]]
binding = "BUDGET"
id = "<your-kv-namespace-id>"

# R2 for artifacts — enable in the dashboard, then uncomment to use R2
# [[r2_buckets]]
# binding = "ARTIFACTS"
# bucket_name = "edgeforge-artifacts"

# Static assets (frontend)
[assets]
directory = "frontend/dist"
binding = "ASSETS"

# ── Optional: real (not simulated) deploys ────────────────────────────────────
# To turn approvals into LIVE workers on your account, set these as secrets
# (`npx wrangler secret put CF_ACCOUNT_ID`, `... CLOUDFLARE_API_TOKEN`) with a
# free-tier token scoped to "Workers Scripts: Edit". Without them the Gatekeeper
# packages an archive instead.
#
# [vars]
# CF_ACCOUNT_SUBDOMAIN = "your-account-subdomain"